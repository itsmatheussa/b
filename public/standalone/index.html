<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Checkout — Ebook Completo + Extensão Lovable</title>
    <meta name="description" content="Preencha seus dados e finalize o pedido via PIX em poucos segundos." />
    <style>
      :root { --bg:#0b0713; --card:#160f24; --line:#2c2140; --fg:#f4f1fb; --muted:#a99fc4; --accent:#a855f7; }
      * { box-sizing: border-box; }
      body { margin:0; background:var(--bg); color:var(--fg); font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
      main { max-width: 34rem; margin: 0 auto; padding: 3rem 1.25rem; }
      h1 { font-size: 1.7rem; margin: 0 0 .25rem; }
      p.sub { color: var(--muted); margin: 0 0 1.5rem; font-size: .9rem; }
      label { display:block; font-size:.8rem; color:var(--muted); margin:.9rem 0 .35rem; }
      input[type=text], input[type=email], input[type=tel] { width:100%; padding:.75rem .9rem; border-radius:.6rem; border:1px solid var(--line); background:var(--card); color:var(--fg); font-size:1rem; }
      .bump { display:flex; gap:.6rem; align-items:flex-start; margin-top:1.2rem; padding:.9rem; border:1px solid var(--line); border-radius:.7rem; background:var(--card); }
      button { width:100%; margin-top:1.4rem; padding:.9rem; border:0; border-radius:.7rem; background:var(--accent); color:#fff; font-weight:700; font-size:1rem; cursor:pointer; }
      button[disabled] { opacity:.6; cursor:progress; }
      .total { margin-top:1.2rem; font-size:1.1rem; font-weight:700; }
      .box { margin-top:1.5rem; padding:1rem; border:1px solid var(--line); border-radius:.7rem; background:var(--card); }
      code { display:block; word-break:break-all; font-size:.75rem; color:var(--muted); margin-top:.6rem; }
      img.qr { width:220px; display:block; margin:.8rem auto; background:#fff; border-radius:.5rem; }
      .msg { margin-top:1rem; font-size:.85rem; color:var(--accent); }
      .err { color:#ff8080; }
      .hidden { display:none; }
    </style>
  </head>
  <body>
    <main>
      <h1>Finalizar pedido</h1>
      <p class="sub">Seus dados são usados apenas para liberar o acesso.</p>

      <form id="form">
        <label for="name">Nome completo</label>
        <input id="name" type="text" required minlength="3" />
        <label for="email">E-mail</label>
        <input id="email" type="email" required />
        <label for="phone">WhatsApp (com DDD)</label>
        <input id="phone" type="tel" required />
        <label for="cpf">CPF (somente números)</label>
        <input id="cpf" type="text" required pattern="\d{11}" />
        <div class="bump">
          <input id="bump" type="checkbox" />
          <label for="bump" style="margin:0;color:var(--fg)">Adicionar 50 Prompts Prontos (+ R$ 10,00)</label>
        </div>
        <p class="total">Total: R$ <span id="total">19,90</span></p>
        <button id="submit" type="submit">Gerar PIX</button>
      </form>

      <div id="pix" class="box hidden">
        <strong>Pague com PIX</strong>
        <img id="qr" class="qr hidden" alt="QR Code PIX" />
        <code id="code"></code>
        <button id="copy" type="button">Copiar código PIX</button>
        <p id="status" class="msg">Aguardando pagamento…</p>
      </div>
      <p id="error" class="msg err hidden"></p>
    </main>

    <script>
      // Aponte para o backend hospedado na Lovable.
      var API = "https://sweet-spark-cloud.lovable.app";
      var PRICE = 19.9, BUMP = 10, orderId = null, poll = null;

      var $ = function (id) { return document.getElementById(id); };
      function total() { return PRICE + ($("bump").checked ? BUMP : 0); }
      function renderTotal() { $("total").textContent = total().toFixed(2).replace(".", ","); }
      $("bump").addEventListener("change", renderTotal);
      renderTotal();

      async function api(path, body) {
        var res = await fetch(API + "/api/public/orders/" + path, {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify(body),
        });
        var data = await res.json();
        if (!res.ok || data.error) throw new Error(data.error || "Erro inesperado");
        return data;
      }

      function fail(msg) { $("error").textContent = msg; $("error").classList.remove("hidden"); }

      $("form").addEventListener("submit", async function (e) {
        e.preventDefault();
        $("error").classList.add("hidden");
        $("submit").disabled = true;
        try {
          if (!orderId) {
            var created = await api("create", {
              name: $("name").value.trim(),
              email: $("email").value.trim(),
              phone: $("phone").value.trim(),
              bump: $("bump").checked,
              total: total(),
            });
            orderId = created.id;
          }
          var pix = await api("pix", { id: orderId, payerDocument: $("cpf").value.replace(/\D/g, "") });
          $("pix").classList.remove("hidden");
          $("code").textContent = pix.pixCode || "";
          if (pix.pixQr) { $("qr").src = pix.pixQr.indexOf("data:") === 0 ? pix.pixQr : "data:image/png;base64," + pix.pixQr; $("qr").classList.remove("hidden"); }
          startPolling();
        } catch (err) {
          fail(err.message);
        } finally {
          $("submit").disabled = false;
        }
      });

      $("copy").addEventListener("click", function () {
        navigator.clipboard.writeText($("code").textContent || "");
        $("copy").textContent = "Copiado!";
        setTimeout(function () { $("copy").textContent = "Copiar código PIX"; }, 2000);
      });

      function startPolling() {
        if (poll) return;
        poll = setInterval(async function () {
          try {
            var r = await api("status", { id: orderId });
            if (r.paid) {
              clearInterval(poll);
              $("status").textContent = "Pagamento confirmado! Acesso enviado para o seu e-mail.";
            }
          } catch (e) { /* segue tentando */ }
        }, 5000);
      }
    </script>
  </body>
</html>
